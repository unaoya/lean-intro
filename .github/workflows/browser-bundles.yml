# ブラウザ版（docs/play/*.lean）の検査。
#   course: 生成物が最新か、講座の Lean（lean-toolchain）でコンパイルできるか
#   stable: 最新の stable 版での互換性を確認する（Lean 4 Web の更新に備える）。
#           Web の Stable Release は更新時期が異なることがあるため、移行時には
#           Web の画面に表示された版でも確認する。この互換性検査は毎週月曜にも走る。
name: browser-bundles

on:
  push:
    paths: ["LeanIntro/**", "docs/play/**", "dev/src/**", "dev/tools/**", ".github/workflows/browser-bundles.yml"]
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        toolchain: [course, stable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: elan を入れる
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: 生成物が最新か
        if: matrix.toolchain == 'course'
        run: |
          python3 dev/tools/student.py
          python3 dev/tools/bundle.py
          # git diff は未追跡ファイルを見ないので、git status で新規ファイルも含めて比べる
          if [ -n "$(git status --porcelain -- LeanIntro docs/play)" ]; then
            git status --short -- LeanIntro docs/play
            echo "LeanIntro/ または docs/play/ が dev/src と一致しない。dev/ で python3 tools/lean2html.py --no-pdf を実行してコミットする"
            exit 1
          fi
      - name: コンパイル（${{ matrix.toolchain }}）
        run: |
          if [ "${{ matrix.toolchain }}" = course ]; then LEAN="lean"; else LEAN="lean +stable"; fi
          $LEAN --version
          python3 dev/tools/bundle.py --check --lean="$LEAN"
